# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.12"

[locales."en-us"]
whats-new = """
Tapping a link in a message's web view now checks it first. If the link's \
text names a different site, the address is a bare number, or the site's \
name uses look-alike letters, Zirbe shows where it really goes before \
opening it, and can open it without tracking. Tracking pixels stay blocked \
after you choose Show Images.

On Gmail and Outlook, a sent message now appears once in Sent, not twice, \
and other mail apps show the messages you replied to as answered.

A reply that fails to send says why under its bubble, and errors read as \
plain sentences. Opening a folder on another account works on the first tap.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
