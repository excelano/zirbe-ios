# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.14"

[locales."en-us"]
whats-new = """
The number on Zirbe's app icon now follows your notification choices. It \
counts the unread inbox messages that would notify you, so a muted \
conversation, or a kind of message set to Nobody, no longer adds to it, and \
with new mail notifications off the icon shows no number. The unread counts \
inside the app still show everything unread.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
