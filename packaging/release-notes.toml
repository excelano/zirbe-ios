# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.11"

[locales."en-us"]
whats-new = """
A mailing list now appears as one conversation named for the list, and \
replies go to the list. You can unsubscribe from its menu.

Reactions work with other mail apps: Zirbe sends and reads standard email \
reactions, including Gmail's.

Undo Send in Settings holds a reply for 5, 10 or 20 seconds so you can take \
it back. A reply that fails to send is kept and tried again, even after you \
close the app, and a message too large for your server comes back to you \
with the reason.

Messages are marked read as they come into view, not all at once when you \
open a conversation. You can always show images from a sender or domain you \
trust, and replies that lost their threading now join their conversation.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
