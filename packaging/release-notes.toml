# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.13"

[locales."en-us"]
whats-new = """
Choose what notifies you. Settings has a new Notify Me About section with \
one choice per kind of message (plain text, formatted text, pictures, \
audio, video, other attachments, invitations, invitation replies, \
reactions, newsletters and lists, automatic notices and anything else): \
Everyone, Favorites or Nobody. Add the people \
you care about to Favorites in Settings or from a conversation's menu.

Any conversation can be set to Always Notify or muted, from its menu or by \
pressing it in the conversation list. Muted conversations show a bell with \
a line through it. Everything still notifies until you change it, and \
reactions now notify too, as "Reacted" with the emoji.

As always, Zirbe talks only to your own mail servers and, when you sign in \
with Microsoft, Microsoft's sign-in service. No backend, no analytics, no \
third-party SDKs.
"""
